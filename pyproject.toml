[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-rental"
version = "0.1.0"
description = "Hertz for robots: rent one for a move, a deep clean or an event"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
robot-rental = "robot_rental.__main__:main"

[tool.setuptools]
packages = ["robot_rental"]
